name: tvOS platform compile

on:
  workflow_dispatch:
  push:
    branches: ["ai/tvos-port-*"]
    paths:
      - ".github/workflows/tvos-platform.yml"
      - "runtime/**"
      - "aurora-main/**"
      - "docs/porting-tvos.md"
  pull_request:
    paths:
      - "runtime/**"
      - "aurora-main/**"
      - "docs/porting-tvos.md"

permissions:
  contents: read

concurrency:
  # A branch push and its PR update describe the same source; key them together
  # to avoid building the expensive Dawn dependency graph twice per commit.
  group: tvos-platform-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tvos-platform-compile:
    name: tvOS SDK compile (no game assets)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure against the Apple TV device SDK
        run: |
          cmake -S runtime -B build-tvos-platform -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_OSX_SYSROOT=appletvos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMKW_BUILD_PRODUCTS=OFF \
            -DMKW_PLATFORM_TESTS_ONLY=ON

      - name: Compile platform and runtime contract tests
        run: |
          cmake --build build-tvos-platform --parallel 3 --target \
            mkw_platform_paths_tests \
            mkw_runtime_config_tests \
            mkw_nand_save_tests \
            mkw_nand_settings_tests \
            mkw_sc_serial_tests \
            mkw_input_expr_tests
          file build-tvos-platform/mkw_platform_paths_tests.app/mkw_platform_paths_tests

      # CMake wraps tvOS executables in .app directories even for this compile-only
      # check. Do not execute these arm64 device binaries on the macOS runner.

  tvos-runtime-audit:
    name: tvOS dependency and native runtime compile audit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure the runtime and graphics dependencies
        run: |
          cmake -S runtime -B build-tvos-audit -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_OSX_SYSROOT=appletvos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMKW_BUILD_PRODUCTS=OFF

      - name: Compile Aurora dependencies and native runtime sources
        run: |
          cmake --build build-tvos-audit --parallel 3 --target \
            mkw_tvos_native_compile mkw_tvos_bundle_smoke

      - name: Validate generated Apple TV app bundle metadata
        run: |
          bundle="build-tvos-audit/mkw_tvos_bundle_smoke.app"
          test -d "$bundle"
          plutil -lint "$bundle/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$bundle/Info.plist")" = "3"
          file "$bundle/mkw_tvos_bundle_smoke"

      # The translated Mario Kart products need generated shards produced from
      # a user's own RMCP01 disc image. This audit intentionally excludes them.
